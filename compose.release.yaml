name: public-pulse-release

services:
  db:
    image: postgres:17

    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DOCKER_POSTGRES_USER} -d ${DOCKER_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/iamprakhar10/public-pulse:latest

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://${DOCKER_POSTGRES_USER}:${DOCKER_POSTGRES_PASSWORD}@db:5432/${DOCKER_POSTGRES_DB}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/iamprakhar10/public-pulse:latest

    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "streamlit",
        "run",
        "frontend/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]

    env_file:
      - .env

    environment:
      API_BASE_URL: http://api:8000

    ports:
      - "127.0.0.1:8501:8501"

    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data: