services:
  db:
    image: postgres:17

    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DOCKER_POSTGRES_USER} -d ${DOCKER_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  test-db:
    image: postgres:17

    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DOCKER_TEST_POSTGRES_DB}

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DOCKER_POSTGRES_USER} -d ${DOCKER_TEST_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://${DOCKER_POSTGRES_USER}:${DOCKER_POSTGRES_PASSWORD}@db:5432/${DOCKER_POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg2://${DOCKER_POSTGRES_USER}:${DOCKER_POSTGRES_PASSWORD}@test-db:5432/${DOCKER_TEST_POSTGRES_DB}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy
      test-db:
        condition: service_healthy

volumes:
  postgres_data: